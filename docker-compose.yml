version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: siak_db
    restart: always
    environment:
      POSTGRES_USER: siak_user
      POSTGRES_PASSWORD: siak_password
      POSTGRES_DB: siak_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siak_user -d siak_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: siak_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@siak.sch.id
      PGADMIN_DEFAULT_PASSWORD: siak_admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
